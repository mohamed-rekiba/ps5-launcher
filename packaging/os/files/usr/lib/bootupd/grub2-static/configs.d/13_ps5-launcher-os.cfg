# PS5 Launcher OS: show the boot menu for 5 seconds (bootupd's default is 1), so there is time
# to press e and start recovery mode (packaging/os/README.md, "Recovery"). bootupd joins this file
# into /boot/grub2/grub.cfg when the system is installed; 14_menu_show_once.cfg, after it, still
# works.
set timeout_style=menu
set timeout=5
