# PS5 Launcher OS: the boot health check's state (see /usr/libexec/ps5-launcher-os/boot-health).
# The launcher reads notice.json, so the folder is readable; its logs/ folder is not.
d /var/lib/ps5-launcher-os 0755 root root -
d /var/lib/ps5-launcher-os/health 0755 root root -
d /var/lib/ps5-launcher-os/health/logs 0700 root root -
