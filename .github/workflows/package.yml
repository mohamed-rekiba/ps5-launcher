name: Package

# Builds the release files for a tag, attaches them to its draft release, checks them, and
# publishes the release. It starts when a v* tag is pushed (Release Please pushes one with
# RELEASE_PLEASE_TOKEN; see release.yml). os.yml starts on the same tag and waits for this
# workflow to publish.
# By hand (workflow_dispatch), "Use workflow from" decides where the files go:
#   a v* tag   builds that tag again and attaches the files to its release (never to a release
#              that is already published)
#   a branch   (main, for example) builds that branch and keeps the files as this run's
#              artifacts, for 14 days; no release is touched

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The tag this run is for: the pushed tag, or by hand the tag under "Use workflow from". From a
  # branch it is the branch name, and only the artifact steps use it.
  TAG: ${{ github.ref_name }}
  # The built app checks this repository for updates (a fork follows its own releases).
  PS5_LAUNCHER_REPO: ${{ github.repository }}

jobs:
  # The draft release the files go to: Release Please's, or a new draft for a tag pushed by hand.
  # A published release is never changed. A run from a branch has no release.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Find or create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a release tag: $TAG"
            exit 1
          fi
          # Release Please pushes the tag and then makes the draft; give its API a moment to show it.
          for _ in 1 2 3 4 5 6; do
            if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>err.txt); then
              break
            fi
            if ! grep -qi 'release not found' err.txt; then
              cat err.txt
              echo "::error::Could not read the release $TAG"
              exit 1
            fi
            draft=missing
            sleep 10
          done
          case $draft in
            true) echo "Draft release $TAG found" ;;
            missing)
              gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes ""
              echo "Made a draft release for $TAG" ;;
            *)
              echo "::error::$TAG is already published. Its files are not changed; make a new release."
              exit 1 ;;
          esac

  linux-x86_64:
    needs: release
    # On a tag after the release job; from a branch, where that job is skipped, straight away.
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    # Ubuntu 22.04 (glibc 2.35) so the binary runs on most distros from the last few years.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NAME: ps5-launcher-linux-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: release
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/package-licenses.test.mjs
          mkdir -p "dist/$NAME/assets"
          cp target/release/ps5-launcher install.sh README.md "dist/$NAME/"
          cp assets/ps5-launcher.svg "dist/$NAME/assets/"
          mkdir -p "dist/$NAME/packaging/linux"
          cp packaging/linux/ps5-launcher.desktop "dist/$NAME/packaging/linux/"
          node scripts/package-licenses.mjs "dist/$NAME" --allow-upstream
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          ls -la dist
      - id: version
        # The tag's version; from a branch, the version in Cargo.toml.
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/linux-packages
        with:
          binary: target/release/ps5-launcher
          version: ${{ steps.version.outputs.version }}
      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256" dist/packages/* --clobber
      - name: Keep as artifacts (a run from a branch)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ps5-launcher-linux-x86_64
          path: |
            dist/${{ env.NAME }}.tar.gz
            dist/${{ env.NAME }}.tar.gz.sha256
            dist/packages/*
          if-no-files-found: error
          retention-days: 14

  # One universal app bundle (Apple Silicon + Intel).
  macos-universal:
    needs: release
    # On a tag after the release job; from a branch, where that job is skipped, straight away.
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          cache-key: macos-release
      - run: brew install libarchive sevenzip librsvg
      - run: cargo test --release --locked --target aarch64-apple-darwin
      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          packaging/macos/bundle.sh \
            target/aarch64-apple-darwin/release/ps5-launcher \
            target/x86_64-apple-darwin/release/ps5-launcher \
            dist
          ls -la dist
      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/ps5-launcher-macos-universal.zip dist/ps5-launcher-macos-universal.zip.sha256 --clobber
      - name: Keep as artifacts (a run from a branch)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ps5-launcher-macos-universal
          path: |
            dist/ps5-launcher-macos-universal.zip
            dist/ps5-launcher-macos-universal.zip.sha256
          if-no-files-found: error
          retention-days: 14

  # Publishes the release once every file is attached. Only on a tag.
  publish:
    needs: [linux-x86_64, macos-universal]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check the files and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          read -r draft assets < <(gh release view "$TAG" --json isDraft,assets --jq '"\(.isDraft) \([.assets[].name] | join(","))"')
          if [ "$draft" != true ]; then
            echo "::error::$TAG is already published; nothing to do"
            exit 1
          fi
          missing=0
          for name in ps5-launcher-linux-x86_64.tar.gz ps5-launcher-linux-x86_64.tar.gz.sha256 \
              ps5-launcher-macos-universal.zip ps5-launcher-macos-universal.zip.sha256; do
            [[ ",$assets," == *",$name,"* ]] || { echo "::error::Missing $name"; missing=1; }
          done
          for ext in .deb .rpm .pkg.tar.zst .AppImage; do
            [[ ",$assets," == *"$ext,"* ]] || { echo "::error::Missing the $ext package"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          gh release edit "$TAG" --draft=false
          echo "Published $TAG"
