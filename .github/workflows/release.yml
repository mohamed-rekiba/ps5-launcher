name: Release

# Release Please keeps a release pull request open on main. It collects the Conventional Commit
# messages since the last release, bumps the version in Cargo.toml / Cargo.lock and writes
# CHANGELOG.md. Merging that pull request creates a *draft* release and pushes its v* tag at once
# (force-tag-creation in .github/release-please-config.json). The tag starts two workflows:
#   package.yml  builds the Linux and macOS files, attaches them to the draft, checks them, and
#                publishes the release
#   os.yml       waits for that, then builds and tests PS5 Launcher OS with the release
# The app's self-updater reads the latest published release, so it never sees one without files.
#
# This needs the secret RELEASE_PLEASE_TOKEN: GitHub starts no workflow from a tag (or a pull
# request) made with the workflow's own token. Use a fine-grained personal access token for this
# repository only, with Contents, Pull requests and Workflows set to "Read and write" (Workflows,
# so a release commit that changes a workflow can be tagged). With it, checks also run on the
# release pull request.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require RELEASE_PLEASE_TOKEN
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The secret RELEASE_PLEASE_TOKEN is missing. Without it, a release tag starts neither Package nor OS. See the top of .github/workflows/release.yml."
            exit 1
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
