name: OS

# The Fedora bootc OS image (packaging/os/) and its installer ISO. It starts when a v* tag is
# pushed, at the same time as package.yml, and waits until package.yml has published that
# release with its files (job wait; prereleases are skipped). It also runs by hand. It replaces
# the Bazzite image (os/ and the old os.yml, both removed). Never push to the Bazzite repository ps5-launcher-os or its
# tags: installed Bazzite PCs still follow them. packaging/os/README.md describes the
# images, the gates and the owner's setup.
#
# Images: ghcr.io/<owner>/ps5-launcher-fedora
#   :main, :nvidia                  release tags; installed PCs follow these
#   :main-YYYYMMDD, :nvidia-YYYYMMDD  dated release tags
#   :testing-main-<run id>, :testing-nvidia-<run id>   candidates of one run
#   :testing-upgrade-<run id>       CI only: the install test's upgrade target (signed)
#   :testing-unsigned-<run id>, :testing-wrongkey-<run id>   CI only: the same image unsigned,
#                                   and signed with a throwaway key; the VM must refuse both
#   :testing-follow-<run id>        CI only: the tag the install test's VM follows; it moves
#
# Image signing (packaging/os/signing/README.md): every candidate is signed with cosign and the
# key OS_IMAGE_SIGNING_KEY (an environment secret of os-fedora-signing), as a legacy sigstore
# attachment (the tag sha256-<digest>.sig in the same repository) with cosign's "simple signing"
# payload. That is the format containers/image reads, so bootc and the image's
# /etc/containers/policy.json check it on every pull. The public key is
# packaging/os/signing/cosign.pub.
#
# Each run:
# 1. prepare: resolves the inputs once: the launcher release (the tag the run is for, or the
#    latest when started from a branch), the
#    digest of fedora-bootc:44 (so daily builds pick up Fedora's updates), the image name, the
#    Secure Boot certificate and the image signing public key.
# 2. main: checks the launcher tarball's checksum, builds its rpm, builds the main image, checks
#    it, and pushes the candidate.
# 3. nvidia: builds the NVIDIA image FROM that exact candidate digest, signed with the
#    SECUREBOOT_KEY secret, checks it, checks that it shares every main layer, and pushes it.
# 4. test-images (CI only): the install test's upgrade target, the same image unsigned, and one
#    signed with a throwaway key made in the job.
# 5. sign: signs the main, NVIDIA and upgrade digests (environment os-fedora-signing, which only
#    the protected main branch and the protected v* tags may use), with the run id, attempt and
#    commit as annotations, then
#    verifies them against the committed public key.
# 6. Gates, all on a runner with KVM (no KVM fails them):
#    boot-test     a qcow2 of the main candidate boots, and its checks pass (session included)
#    install-test  the netinstaller installs the candidate with no one at the keyboard; its first
#                  start makes bootc enforce the signature policy. Then: bootc switch and bootc
#                  upgrade to the unsigned and the wrong-key image are refused; the signed
#                  upgrade, bootc rollback, and the switch to NVIDIA and back work. It also
#                  makes the candidate-iso artifact for the hardware tests: an ISO that installs
#                  this run's tested digests, its checksum, manifest.txt, and the test kit.
# 7. release-guard: fails every run with promote or attach_iso on while OS_IMAGE_SIGNING (below)
#    is not "enabled".
# 8. promote: checks both digests' signatures (cosign verify against the committed key, with this
#    run's id, attempt and commit, and a Fedora 44 skopeo copy under the image's own policy), then
#    copies the tested digests to the release tags and checks every tag's digest and signature.
#    Only when asked (input promote), only from main, and only after the environment
#    os-fedora-release approves it: its reviewers confirm the hardware tests
#    (packaging/os/hardware-test.md), which CI cannot run (Secure Boot, real GPUs). The approval
#    must cite hardware results for this exact run id, attempt and pair of digests. Scheduled
#    runs never promote.
# 9. iso: after promotion, and only when asked (input attach_iso), checks the promoted digests'
#    signatures again and attaches ps5-launcher-fedora-x86_64.iso, which installs exactly those
#    digests, to the launcher release.
#
# TODO: delete old testing-* tags (and their .sig tags) from the registry.

on:
  # TODO: bring back the nightly schedule (cron "45 4 * * *") once the signing environment and
  # SECUREBOOT_KEY exist and one manual run is green. Without them every scheduled run fails.
  push:
    tags: ["v*"]
  # By hand, "Use workflow from" picks the launcher: a v* tag builds that release, and a branch
  # builds the latest release (promotion runs only from main).
  workflow_dispatch:
    inputs:
      promote:
        description: Promote the tested images to the release tags (needs the environment's approval)
        type: boolean
        default: false
      attach_iso:
        description: After promotion, attach the installer ISO to the launcher release
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ps5-launcher-fedora
  cancel-in-progress: false

env:
  # The registry owner. A fork that sets the repository variable OS_IMAGE_OWNER to its own name
  # tests under that name; by default it is the repository's owner.
  IMAGE_OWNER: ${{ vars.OS_IMAGE_OWNER || github.repository_owner }}
  FEDORA_BASE: quay.io/fedora/fedora-bootc:44
  CERT: packaging/os/secureboot/public_key.der
  SIGNING_PUBKEY: packaging/os/signing/cosign.pub
  RUN_ID: ${{ github.run_id }}
  # The public-release guard (job release-guard). It is in this file, not a repository variable,
  # so only a reviewed change can lift it. Signing, its checks in promote and the policy in the
  # image are built; what is left: the owner's keys (packaging/os/signing/README.md) and one green
  # run of this whole workflow. Set it to "enabled" only in a separate, reviewed change after
  # that run, citing its run id.
  OS_IMAGE_SIGNING: disabled

defaults:
  run:
    shell: bash

jobs:
  # On a tag push: wait for package.yml to publish this release with its files. A prerelease is
  # not a launcher release that installed PCs should get, so it skips the rest.
  wait:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      build: ${{ steps.release.outputs.build }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Package builds and tests for about 30 minutes; give it up to 90.
          for _ in $(seq 90); do
            if state=$(gh release view "$TAG" --json isDraft,isPrerelease,assets \
                --jq '"\(.isDraft) \(.isPrerelease) \(any(.assets[]; .name == "ps5-launcher-linux-x86_64.tar.gz"))"' 2>/dev/null); then
              read -r draft prerelease tarball <<<"$state"
              if [ "$draft" = false ] && [ "$prerelease" = true ]; then
                echo "$TAG is a prerelease: no OS image"
                echo "build=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$draft" = false ] && [ "$tarball" = true ]; then
                echo "$TAG is published with its files"
                echo "build=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            # Stop early when this tag's Package run failed or was cancelled.
            result=$(gh run list --workflow package.yml --branch "$TAG" --limit 1 \
                --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' 2>/dev/null || true)
            case $result in
              "completed failure" | "completed cancelled" | "completed timed_out")
                echo "::error::Package failed for $TAG ($result), so its release has no files to build the OS from"
                exit 1 ;;
            esac
            sleep 60
          done
          echo "::error::$TAG was not published with its files within 90 minutes. Check the Package run for $TAG."
          exit 1

  prepare:
    needs: wait
    # After wait on a tag push; by hand, wait is skipped.
    if: ${{ !cancelled() && (needs.wait.result == 'skipped' || needs.wait.outputs.build == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      base: ${{ steps.resolve.outputs.base }}
      launcher_tag: ${{ steps.resolve.outputs.launcher_tag }}
      cert_sha256: ${{ steps.resolve.outputs.cert_sha256 }}
      signing_sha256: ${{ steps.resolve.outputs.signing_sha256 }}
      date: ${{ steps.resolve.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag the run is for (pushed, or picked under "Use workflow from"); from a branch,
          # empty, which means the latest release.
          LAUNCHER_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ ! -f "$CERT" ]; then
            echo "::error::No Secure Boot certificate at $CERT. The owner makes it once: see packaging/os/secureboot/README.md"
            exit 1
          fi
          cert_sha256=$(sha256sum "$CERT" | cut -d' ' -f1)
          if [ ! -f "$SIGNING_PUBKEY" ]; then
            echo "::error::No image signing public key at $SIGNING_PUBKEY. The owner makes it once: see packaging/os/signing/README.md"
            exit 1
          fi
          openssl pkey -pubin -in "$SIGNING_PUBKEY" -noout
          signing_sha256=$(sha256sum "$SIGNING_PUBKEY" | cut -d' ' -f1)
          owner=${IMAGE_OWNER,,}
          image=ghcr.io/$owner/ps5-launcher-fedora
          if ! [[ $owner =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::Invalid image owner: $owner"
            exit 1
          fi
          # The base: one digest for the whole run, recorded in the image's label.
          digest=sha256:$(skopeo inspect --raw "docker://$FEDORA_BASE" | sha256sum | cut -d' ' -f1)
          base=${FEDORA_BASE%:*}@$digest
          # The launcher: the input, or the latest release, resolved once.
          tag=${LAUNCHER_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}
          if ! [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid launcher tag: $tag"
            exit 1
          fi
          {
            echo "image=$image"
            echo "base=$base"
            echo "launcher_tag=$tag"
            echo "cert_sha256=$cert_sha256"
            echo "signing_sha256=$signing_sha256"
            echo "date=$(date -u +%Y%m%d)"
          } | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Inputs"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$image\` |"
            echo "| Fedora base | \`$base\` (from \`$FEDORA_BASE\`) |"
            echo "| Launcher | \`$tag\` |"
            echo "| Secure Boot certificate SHA-256 | \`$cert_sha256\` |"
            echo "| Image signing public key SHA-256 | \`$signing_sha256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  main:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      BASE: ${{ needs.prepare.outputs.base }}
      LAUNCHER_TAG: ${{ needs.prepare.outputs.launcher_tag }}
      CERT_SHA256: ${{ needs.prepare.outputs.cert_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Unpack the launcher release, checked against its checksum
        id: launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=$RUNNER_TEMP/release
          gh release download "$LAUNCHER_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'ps5-launcher-linux-x86_64.tar.gz*' --dir "$dir"
          (cd "$dir" && sha256sum -c ps5-launcher-linux-x86_64.tar.gz.sha256)
          tar -C "$dir" -xzf "$dir/ps5-launcher-linux-x86_64.tar.gz"
          "$dir/ps5-launcher-linux-x86_64/ps5-launcher" --version
          echo "binary=$dir/ps5-launcher-linux-x86_64/ps5-launcher" >> "$GITHUB_OUTPUT"
          echo "version=${LAUNCHER_TAG#v}" >> "$GITHUB_OUTPUT"

      # The rpm is built from this checkout's packaging files around the release binary.
      - uses: ./.github/actions/linux-packages
        with:
          binary: ${{ steps.launcher.outputs.binary }}
          version: ${{ steps.launcher.outputs.version }}
          output: dist/packages
          format: rpm

      - name: Build the main image
        env:
          VERSION: ${{ steps.launcher.outputs.version }}
        run: |
          rpm=$(ls dist/packages/ps5-launcher-*.x86_64.rpm)
          sudo env ENGINE=podman IMAGE=localhost/ps5-launcher-fedora IMAGE_REF="$IMAGE:main" \
            BASE_IMAGE="$BASE" LAUNCHER_RPM="$rpm" LAUNCHER_VERSION="$VERSION" \
            packaging/os/build-image.sh main 2>&1 | tee build-main.log

      - name: Check the main image
        run: |
          sudo env ENGINE=podman packaging/os/check-image.sh main localhost/ps5-launcher-fedora:main \
            "$IMAGE:main" "$CERT_SHA256" 2>&1 | tee check-main.log

      - name: Push the candidate
        id: push
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          ref=$IMAGE:testing-main-$RUN_ID
          for try in 1 2 3; do
            sudo podman push --digestfile digest localhost/ps5-launcher-fedora:main "docker://$ref" && break
            [ "$try" = 3 ] && exit 1
            sleep 30
          done
          digest=$(cat digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          size=$(sudo podman image inspect localhost/ps5-launcher-fedora:main --format '{{.Size}}' | numfmt --to=iec)
          echo "Main candidate: \`$ref\` = \`$digest\` ($size uncompressed)" >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-logs
          path: "*.log"
          if-no-files-found: ignore

  nvidia:
    needs: [prepare, main]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      CERT_SHA256: ${{ needs.prepare.outputs.cert_sha256 }}
      MAIN: ${{ needs.prepare.outputs.image }}@${{ needs.main.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Check the signing key against the certificate
        env:
          SECUREBOOT_KEY: ${{ secrets.SECUREBOOT_KEY }}
        run: |
          if [ -z "$SECUREBOOT_KEY" ]; then
            echo "::error::The SECUREBOOT_KEY secret is not set: see packaging/os/secureboot/README.md"
            exit 1
          fi
          key=$RUNNER_TEMP/secureboot/private_key.priv
          mkdir -m 700 "$(dirname "$key")"
          (umask 077 && printf '%s\n' "$SECUREBOOT_KEY" > "$key")
          cert_pub=$(openssl x509 -inform DER -in "$CERT" -noout -pubkey | openssl pkey -pubin -outform DER | sha256sum)
          key_pub=$(openssl pkey -in "$key" -pubout -outform DER | sha256sum)
          if [ "$cert_pub" != "$key_pub" ]; then
            echo "::error::SECUREBOOT_KEY does not belong to $CERT: see packaging/os/secureboot/README.md"
            exit 1
          fi
          echo "The key matches $CERT"

      - name: Build the NVIDIA image FROM the main candidate
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$MAIN"
          sudo env ENGINE=podman IMAGE=localhost/ps5-launcher-fedora IMAGE_REF="$IMAGE:nvidia" \
            MAIN_IMAGE="$MAIN" SECUREBOOT_KEY_FILE="$RUNNER_TEMP/secureboot/private_key.priv" \
            packaging/os/build-image.sh nvidia 2>&1 | tee build-nvidia.log

      - name: Delete the signing key
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/secureboot" ]; then
            find "$RUNNER_TEMP/secureboot" -type f -exec shred -u {} +
            rm -rf "$RUNNER_TEMP/secureboot"
          fi

      - name: Check the NVIDIA image
        run: |
          sudo env ENGINE=podman packaging/os/check-image.sh nvidia localhost/ps5-launcher-fedora:nvidia \
            "$IMAGE:nvidia" "$CERT_SHA256" "$MAIN" 2>&1 | tee check-nvidia.log

      - name: Push the candidate
        id: push
        run: |
          ref=$IMAGE:testing-nvidia-$RUN_ID
          for try in 1 2 3; do
            sudo podman push --digestfile digest localhost/ps5-launcher-fedora:nvidia "docker://$ref" && break
            [ "$try" = 3 ] && exit 1
            sleep 30
          done
          digest=$(cat digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "NVIDIA candidate: \`$ref\` = \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Check that the NVIDIA image shares every main layer
        env:
          NVIDIA_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # A switch from main downloads only the layers main does not have.
          sudo skopeo inspect --raw "docker://$MAIN" | jq -r '.layers[].digest' > main-layers
          sudo skopeo inspect --raw "docker://$IMAGE@$NVIDIA_DIGEST" | tee nvidia-manifest.json >/dev/null
          jq -r '.layers[].digest' nvidia-manifest.json > nvidia-layers
          n=$(wc -l < main-layers)
          if ! head -n "$n" nvidia-layers | cmp -s - main-layers; then
            echo "::error::The NVIDIA image does not start with the main image's layers"
            exit 1
          fi
          extra=$(jq "[.layers[$n:][].size] | add" nvidia-manifest.json)
          echo "The switch from main downloads $(numfmt --to=iec "$extra") (compressed) in $(( $(wc -l < nvidia-layers) - n )) layers" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nvidia-logs
          path: "*.log"
          if-no-files-found: ignore

  # CI only: the install test's images, all FROM the main candidate plus a marker file. The
  # upgrade target is signed by the sign job; the unsigned one never is; the wrong-key one is
  # signed here with a throwaway key made in this job. No secret is used.
  test-images:
    needs: [prepare, main]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      upgrade: ${{ steps.push.outputs.upgrade }}
      unsigned: ${{ steps.push.outputs.unsigned }}
      wrongkey: ${{ steps.push.outputs.wrongkey }}
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      MAIN: ${{ needs.prepare.outputs.image }}@${{ needs.main.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: ./.github/actions/cosign
        with:
          token: ${{ github.token }}

      - name: Build and push the upgrade, unsigned and wrong-key images
        id: push
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$MAIN"
          for kind in upgrade unsigned wrongkey; do
            # A different marker each, so each is its own digest.
            sudo podman build --build-arg MAIN_IMAGE="$MAIN" --build-arg MARKER="$kind-$RUN_ID" \
              -f packaging/os/boottest/Containerfile.upgrade -t "localhost/ps5-launcher-fedora:$kind" \
              packaging/os/boottest
            sudo podman push --digestfile "digest-$kind" "localhost/ps5-launcher-fedora:$kind" \
              "docker://$IMAGE:testing-$kind-$RUN_ID"
            digest=$(cat "digest-$kind")
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Not a digest: $digest"; exit 1; }
            echo "$kind=$digest" >> "$GITHUB_OUTPUT"
            echo "Test image \`$IMAGE:testing-$kind-$RUN_ID\` = \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Sign the wrong-key image with a throwaway key
        run: |
          # Made here, used once, never kept. The same cosign flags as the sign job.
          dir=$RUNNER_TEMP/throwaway
          mkdir -m 700 "$dir"
          COSIGN_PASSWORD=$(openssl rand -hex 16)
          export COSIGN_PASSWORD
          (cd "$dir" && cosign generate-key-pair --output-key-prefix throwaway)
          digest=$(cat digest-wrongkey)
          cosign sign --key "$dir/throwaway.key" --use-signing-config=false --new-bundle-format=false \
            --tlog-upload=false --registry-referrers-mode=legacy --yes "$IMAGE@$digest"
          # It must verify with the throwaway key, and never with ours.
          cosign verify --key "$dir/throwaway.pub" --insecure-ignore-tlog --new-bundle-format=false \
            "$IMAGE@$digest" >/dev/null
          if cosign verify --key "$SIGNING_PUBKEY" --insecure-ignore-tlog --new-bundle-format=false \
            "$IMAGE@$digest" >/dev/null 2>&1; then
            echo "::error::The wrong-key image verifies with $SIGNING_PUBKEY"
            exit 1
          fi
          rm -rf "$dir"

  # Signs this run's candidates right after they are pushed, before any gate pulls them. The
  # signing secrets are environment secrets of os-fedora-signing, whose deployment rule allows
  # only the protected main branch and the protected v* tags (packaging/os/signing/README.md):
  # no other branch or tag can sign.
  # cosign v3.1.3 flags (cmd/cosign/cli/options/sign.go): --new-bundle-format=false (:161) and
  # --tlog-upload=false (:125) write the legacy signature with the simple signing payload and no
  # transparency log; both need --use-signing-config=false (:164; signcommon/common.go:437-442).
  # --registry-referrers-mode=legacy (registry.go:221) keeps the sha256-<digest>.sig tag
  # (sign/sign.go:447-451). The annotations land in the payload's "optional" part; never use the
  # keys "creator" or "timestamp", which containers/image parses itself.
  sign:
    needs: [prepare, main, nvidia, test-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: os-fedora-signing
    outputs:
      attempt: ${{ steps.sign.outputs.attempt }}
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      MAIN_DIGEST: ${{ needs.main.outputs.digest }}
      NVIDIA_DIGEST: ${{ needs.nvidia.outputs.digest }}
      UPGRADE_DIGEST: ${{ needs.test-images.outputs.upgrade }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/cosign
        with:
          token: ${{ github.token }}

      - name: Sign the candidates
        id: sign
        env:
          OS_IMAGE_SIGNING_KEY: ${{ secrets.OS_IMAGE_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$OS_IMAGE_SIGNING_KEY" ] || [ -z "$COSIGN_PASSWORD" ]; then
            echo "::error::The secrets OS_IMAGE_SIGNING_KEY and COSIGN_PASSWORD of the environment os-fedora-signing are not set: see packaging/os/signing/README.md"
            exit 1
          fi
          # The secret must be the private half of the committed public key.
          der() { openssl pkey -pubin -outform DER | sha256sum; }
          if [ "$(cosign public-key --key env://OS_IMAGE_SIGNING_KEY | der)" != "$(der < "$SIGNING_PUBKEY")" ]; then
            echo "::error::OS_IMAGE_SIGNING_KEY does not belong to $SIGNING_PUBKEY: see packaging/os/signing/README.md"
            exit 1
          fi
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          for pair in "main:$MAIN_DIGEST" "nvidia:$NVIDIA_DIGEST" "upgrade:$UPGRADE_DIGEST"; do
            variant=${pair%%:*}
            digest=${pair#*:}
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Not a digest: $digest"; exit 1; }
            cosign sign --key env://OS_IMAGE_SIGNING_KEY --use-signing-config=false \
              --new-bundle-format=false --tlog-upload=false --registry-referrers-mode=legacy --yes \
              -a "io.github.ps5-launcher.run-id=$RUN_ID" -a "io.github.ps5-launcher.run-attempt=$GITHUB_RUN_ATTEMPT" \
              -a "io.github.ps5-launcher.commit=$GITHUB_SHA" -a "io.github.ps5-launcher.variant=$variant" \
              "$IMAGE@$digest"
            # Verify at once, with the committed key only (no transparency log: key-based).
            cosign verify --key "$SIGNING_PUBKEY" --insecure-ignore-tlog --new-bundle-format=false \
              -a "io.github.ps5-launcher.run-id=$RUN_ID" -a "io.github.ps5-launcher.commit=$GITHUB_SHA" \
              -a "io.github.ps5-launcher.variant=$variant" "$IMAGE@$digest" > "verify-$variant.json"
            echo "Signed \`$IMAGE@$digest\` ($variant), run $RUN_ID attempt $GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
          done

  boot-test:
    needs: [prepare, main]
    # A self-hosted runner with KVM can take over with the repository variable OS_VM_RUNNER.
    runs-on: ${{ vars.OS_VM_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      MAIN: ${{ needs.prepare.outputs.image }}@${{ needs.main.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::No /dev/kvm on this runner: the boot test cannot run, so this gate fails"
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build the boot test image (CI only, never pushed)
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$MAIN"
          sudo podman build --build-arg MAIN_IMAGE="$MAIN" -t localhost/ps5-launcher-fedora:boottest \
            packaging/os/boottest

      - name: Make a qcow2 with image-builder
        run: |
          mkdir -p out
          sudo podman run --rm --privileged \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/out:/out" quay.io/fedora/fedora:44 bash -euxc '
              dnf -y -q install image-builder
              image-builder build --bootc-ref localhost/ps5-launcher-fedora:boottest \
                --bootc-default-fs ext4 --output-dir /out qcow2' 2>&1 | tee image-builder.log
          sudo find out -type f -exec ls -la {} +

      - name: Boot it, and check the report
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf socat imagemagick >/dev/null
          disk=$(sudo find out -name '*.qcow2' | head -1)
          sudo chown "$(id -u)" "$disk"
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          qemu-system-x86_64 -enable-kvm -machine q35 -m 6G -smp 4 -cpu host \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file="$disk",if=virtio,format=qcow2 -device virtio-vga -display none \
            -qmp unix:qmp.sock,server,nowait -serial file:serial.log -serial file:report.log \
            -daemonize -pidfile qemu.pid
          # The report (packaging/os/boottest/report) ends with "===== end".
          for _ in $(seq 180); do
            grep -q "===== end" report.log 2>/dev/null && break
            sleep 5
          done
          printf '{"execute":"qmp_capabilities"}\n{"execute":"screendump","arguments":{"filename":"%s/boot.ppm"}}\n' "$PWD" \
            | socat - UNIX-CONNECT:qmp.sock >/dev/null || true
          sleep 2
          convert boot.ppm boot.png || true
          kill "$(cat qemu.pid)" || true
          tr -d '\r' < report.log > boot.log
          sed -n '/===== checks/,/RESULT:/p' boot.log | tee -a "$GITHUB_STEP_SUMMARY"
          if ! grep -q "===== end" boot.log; then
            echo "::error::The boot report did not finish within 15 minutes (see serial.log)"
            exit 1
          fi
          grep -qx "RESULT: PASS" boot.log || { echo "::error::The boot test failed: see boot.log"; exit 1; }

      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" . || true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-test
          path: |
            *.log
            boot.png
          if-no-files-found: ignore

  install-test:
    needs: [prepare, main, nvidia, test-images, sign]
    runs-on: ${{ vars.OS_VM_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      MAIN_DIGEST: ${{ needs.main.outputs.digest }}
      NVIDIA_DIGEST: ${{ needs.nvidia.outputs.digest }}
      UPGRADE_DIGEST: ${{ needs.test-images.outputs.upgrade }}
      UNSIGNED_DIGEST: ${{ needs.test-images.outputs.unsigned }}
      WRONGKEY_DIGEST: ${{ needs.test-images.outputs.wrongkey }}
      MAIN_TAG: testing-main-${{ github.run_id }}
      NVIDIA_TAG: testing-nvidia-${{ github.run_id }}
      UNSIGNED_TAG: testing-unsigned-${{ github.run_id }}
      WRONGKEY_TAG: testing-wrongkey-${{ github.run_id }}
      FOLLOW_TAG: testing-follow-${{ github.run_id }}
      BASE: ${{ needs.prepare.outputs.base }}
      LAUNCHER_TAG: ${{ needs.prepare.outputs.launcher_tag }}
      CERT_SHA256: ${{ needs.prepare.outputs.cert_sha256 }}
      SIGNING_SHA256: ${{ needs.prepare.outputs.signing_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::No /dev/kvm on this runner: the install test cannot run, so this gate fails"
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Check that the VM can pull the candidates
        run: |
          # The VM pulls without credentials, as installed PCs do.
          for digest in "$MAIN_DIGEST" "$NVIDIA_DIGEST" "$UPGRADE_DIGEST" "$UNSIGNED_DIGEST" "$WRONGKEY_DIGEST"; do
            if ! skopeo inspect --no-creds --raw "docker://$IMAGE@$digest" >/dev/null; then
              echo "::error::$IMAGE is not public. Make the package public in its GitHub settings (packaging/os/README.md)"
              exit 1
            fi
          done

      - name: Install, check the signature gates, upgrade, roll back, switch to NVIDIA and back
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf socat jq skopeo >/dev/null
          # install-test.sh moves FOLLOW_TAG with sudo skopeo, which reads root's login.
          echo "${{ github.token }}" | sudo skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          OUT=$PWD/install-test packaging/os/boottest/install-test.sh 2>&1 | tee install-test.log

      # For the hardware tests before promotion (packaging/os/hardware-test.md): the installer
      # ISO, set to install this run's tested digests, never a tag (a rerun of this run id moves
      # the testing tags). After the install the PC follows the release tag, main or nvidia.
      - name: Build the candidate ISO and the hardware test kit
        run: |
          for digest in "$MAIN_DIGEST" "$NVIDIA_DIGEST" "$UPGRADE_DIGEST"; do
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Not a digest: $digest"; exit 1; }
          done
          # The kickstart installs this run's signed digest of the chosen image (main or nvidia).
          iso=ps5-launcher-fedora-candidate-x86_64.iso
          docker run --rm --privileged -v "$PWD:/src" -w /src -e IMAGE="$IMAGE" \
            -e MAIN_DIGEST="$MAIN_DIGEST" -e NVIDIA_DIGEST="$NVIDIA_DIGEST" -e ISO_CACHE=/src/install-test \
            quay.io/fedora/fedora:44 packaging/os/build-iso.sh "$iso"
          kit=candidate-iso
          mkdir -p "$kit"
          sudo mv "$iso" "$kit/"
          sudo chown -R "$(id -u):$(id -g)" "$kit"
          (cd "$kit" && sha256sum "$iso" > "$iso.sha256")
          # One KEY=VALUE per line, so a tester can load it in a shell: . manifest.txt
          {
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "COMMIT=$GITHUB_SHA"
            echo "IMAGE=$IMAGE"
            echo "MAIN_DIGEST=$MAIN_DIGEST"
            echo "NVIDIA_DIGEST=$NVIDIA_DIGEST"
            echo "UPGRADE_DIGEST=$UPGRADE_DIGEST"
            echo "BASE_IMAGE=$BASE"
            echo "LAUNCHER_VERSION=${LAUNCHER_TAG#v}"
            echo "SECUREBOOT_CERT_SHA256=$CERT_SHA256"
            echo "SIGNING_PUBKEY_SHA256=$SIGNING_SHA256"
            echo "ISO_SHA256=$(cut -d' ' -f1 "$kit/$iso.sha256")"
          } > "$kit/manifest.txt"
          cp packaging/os/hardware-test.md packaging/os/collect-hardware-logs.sh "$kit/"
          {
            echo "### Candidate for the hardware tests"
            echo "Artifact \`candidate-iso\`: the ISO, its \`.sha256\`, \`manifest.txt\`, \`hardware-test.md\` and \`collect-hardware-logs.sh\`."
            echo
            echo '```'
            cat "$kit/manifest.txt"
            echo '```'
            echo
            echo "**Approve a promotion of this run only with hardware results that cite run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT, main \`$MAIN_DIGEST\` and nvidia \`$NVIDIA_DIGEST\`.**"
          } >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" . || true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-test
          path: |
            *.log
            install-test/*.log
            install-test/*.ppm
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-iso
          path: candidate-iso/
          if-no-files-found: error
          retention-days: 14

  # The public-release guard: promotion and the release ISO publish what installed PCs trust, so
  # they wait until image signing has run end to end (OS_IMAGE_SIGNING at the top). It has no
  # environment, so it fails before anyone is asked to approve.
  release-guard:
    if: inputs.promote || inputs.attach_iso
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse to publish before image signing has run end to end
        run: |
          if [ "$OS_IMAGE_SIGNING" != enabled ]; then
            echo "::error::Promotion and the release ISO are blocked. Image signing is built, but two things are left: the owner's signing keys (packaging/os/signing/README.md), then one green run of this whole workflow. A separate, reviewed change then sets OS_IMAGE_SIGNING to enabled, citing that run. Run without promote and attach_iso to get the candidates."
            exit 1
          fi
          echo "Image signing is enabled"

  promote:
    needs: [prepare, main, nvidia, sign, boot-test, install-test, release-guard]
    if: inputs.promote && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The owner adds required reviewers to this environment. They approve only with hardware
    # results (packaging/os/hardware-test.md) for this exact run id, attempt and digest pair.
    environment: os-fedora-release
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      DATE: ${{ needs.prepare.outputs.date }}
      MAIN_DIGEST: ${{ needs.main.outputs.digest }}
      NVIDIA_DIGEST: ${{ needs.nvidia.outputs.digest }}
      SIGN_ATTEMPT: ${{ needs.sign.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: ./.github/actions/cosign
        with:
          token: ${{ github.token }}

      - name: Record what the approval covers
        run: |
          {
            echo "### Promotion"
            echo "Run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT, commit \`$GITHUB_SHA\`"
            echo
            echo "| | Digest |"
            echo "|---|---|"
            echo "| main | \`$MAIN_DIGEST\` |"
            echo "| nvidia | \`$NVIDIA_DIGEST\` |"
            echo
            echo "**The approval of this deployment must cite hardware results (packaging/os/hardware-test.md) for run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT, and exactly these two digests.** Results for another run or another digest do not count."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check both signatures, with cosign and with the image's own policy
        run: |
          # 1. cosign: the committed key, this exact digest, and this run's provenance (run id,
          #    the sign job's attempt, commit, variant), from the signature's annotations.
          for pair in "main:$MAIN_DIGEST" "nvidia:$NVIDIA_DIGEST"; do
            variant=${pair%%:*}
            digest=${pair#*:}
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Not a digest: $digest"; exit 1; }
            cosign verify --key "$SIGNING_PUBKEY" --insecure-ignore-tlog --new-bundle-format=false \
              -a "io.github.ps5-launcher.run-id=$RUN_ID" -a "io.github.ps5-launcher.run-attempt=$SIGN_ATTEMPT" \
              -a "io.github.ps5-launcher.commit=$GITHUB_SHA" -a "io.github.ps5-launcher.variant=$variant" \
              "$IMAGE@$digest" > "verify-$variant.json"
            jq -e --arg d "$digest" --arg r "$IMAGE" \
              'all(.[]; .critical.image["docker-manifest-digest"] == $d and .critical.identity["docker-reference"] == $r)' \
              "verify-$variant.json" >/dev/null || { echo "::error::A signature of $variant names another digest or repository"; exit 1; }
            echo "cosign: \`$IMAGE@$digest\` ($variant) is signed by $SIGNING_PUBKEY for run $RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          done
          # 2. What installed PCs run: Fedora 44's skopeo, the image's policy.json and registries.d
          #    (packaging/os/signing/*.in for this repository), a full copy of each digest.
          mkdir -p sigcheck/registries.d
          sed "s|@REPOSITORY@|$IMAGE|; s|/usr/share/ps5-launcher/signing/cosign.pub|/src/$SIGNING_PUBKEY|" \
            packaging/os/signing/policy.json.in > sigcheck/policy.json
          sed "s|@REPOSITORY@|$IMAGE|" packaging/os/signing/registries.yaml.in > sigcheck/registries.d/ps5-launcher.yaml
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP:/out" -w /src \
            -e IMAGE -e MAIN_DIGEST -e NVIDIA_DIGEST quay.io/fedora/fedora:44 bash -euo pipefail -c '
              dnf -y -q install skopeo >/dev/null
              skopeo --version
              for digest in "$MAIN_DIGEST" "$NVIDIA_DIGEST"; do
                rm -rf /out/copy
                skopeo --policy sigcheck/policy.json --registries.d sigcheck/registries.d \
                  copy --quiet "docker://$IMAGE@$digest" dir:/out/copy
                echo "skopeo copy under the image policy accepts $IMAGE@$digest"
              done
              rm -rf /out/copy' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Copy the tested digests to the release tags
        run: |
          echo "${{ github.token }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The same repository, so each signature (the tag sha256-<digest>.sig) follows its digest.
          promote() { # DIGEST TAG
            skopeo copy --preserve-digests "docker://$IMAGE@$1" "docker://$IMAGE:$2"
            got=sha256:$(skopeo inspect --raw "docker://$IMAGE:$2" | sha256sum | cut -d' ' -f1)
            [ "$got" = "$1" ] || { echo "::error::$IMAGE:$2 is $got, not $1"; exit 1; }
            echo "\`$IMAGE:$2\` = \`$1\`" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          # Main first: an NVIDIA PC that switches back must find the main image of its pair.
          promote "$MAIN_DIGEST" "main-$DATE"
          promote "$NVIDIA_DIGEST" "nvidia-$DATE"
          promote "$MAIN_DIGEST" main
          promote "$NVIDIA_DIGEST" nvidia

      - name: Check every release tag's digest and signature
        run: |
          for pair in "main-$DATE:$MAIN_DIGEST" "nvidia-$DATE:$NVIDIA_DIGEST" "main:$MAIN_DIGEST" "nvidia:$NVIDIA_DIGEST"; do
            tag=${pair%%:*}
            want=${pair#*:}
            got=sha256:$(skopeo inspect --raw "docker://$IMAGE:$tag" | sha256sum | cut -d' ' -f1)
            [ "$got" = "$want" ] || { echo "::error::$IMAGE:$tag is $got, not $want"; exit 1; }
            # By tag: cosign resolves it to its digest and checks that digest's signature.
            cosign verify --key "$SIGNING_PUBKEY" --insecure-ignore-tlog --new-bundle-format=false \
              -a "io.github.ps5-launcher.run-id=$RUN_ID" -a "io.github.ps5-launcher.commit=$GITHUB_SHA" \
              "$IMAGE:$tag" > /dev/null
            echo "\`$IMAGE:$tag\` = \`$want\`, signed" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  iso:
    needs: [prepare, main, nvidia, release-guard, promote]
    if: inputs.attach_iso
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      LAUNCHER_TAG: ${{ needs.prepare.outputs.launcher_tag }}
      MAIN_DIGEST: ${{ needs.main.outputs.digest }}
      NVIDIA_DIGEST: ${{ needs.nvidia.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cosign
        with:
          token: ${{ github.token }}
      - name: Check the promoted digests and their signatures
        run: |
          # The installer checks no signature, so the ISO embeds exactly the digests promote
          # checked, and only while the release tags still point at them.
          for pair in "main:$MAIN_DIGEST" "nvidia:$NVIDIA_DIGEST"; do
            tag=${pair%%:*}
            want=${pair#*:}
            got=sha256:$(skopeo inspect --raw "docker://$IMAGE:$tag" | sha256sum | cut -d' ' -f1)
            [ "$got" = "$want" ] || { echo "::error::$IMAGE:$tag is $got, not the promoted $want"; exit 1; }
            cosign verify --key "$SIGNING_PUBKEY" --insecure-ignore-tlog --new-bundle-format=false \
              -a "io.github.ps5-launcher.run-id=$RUN_ID" "$IMAGE@$want" > /dev/null
            echo "The ISO installs \`$IMAGE@$want\` for $tag, signed" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Build the ISO
        run: |
          iso=ps5-launcher-fedora-x86_64.iso
          docker run --rm --privileged -v "$PWD:/src" -w /src -e IMAGE="$IMAGE" \
            -e MAIN_DIGEST="$MAIN_DIGEST" -e NVIDIA_DIGEST="$NVIDIA_DIGEST" -e ISO_CACHE=/src \
            quay.io/fedora/fedora:44 packaging/os/build-iso.sh "$iso"
          sha256sum "$iso" > "$iso.sha256"
          size=$(stat -c %s "$iso")
          echo "ISO: $size bytes"
          # GitHub's limit for one release file is 2 GiB.
          test "$size" -lt 2000000000
      - name: Attach to the launcher release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$LAUNCHER_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            ps5-launcher-fedora-x86_64.iso ps5-launcher-fedora-x86_64.iso.sha256
