name: cosign
description: Install a pinned cosign binary, checked against its SHA-256, and log it in to GHCR
inputs:
  token:
    description: Token for ghcr.io (cosign reads ~/.docker/config.json, not podman's login)
    required: true
runs:
  using: composite
  steps:
    - name: Install cosign
      shell: bash
      env:
        # The release asset cosign-linux-amd64 of v3.1.3, and its line in that release's
        # cosign_checksums.txt. Change both together.
        VERSION: v3.1.3
        SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
        TOKEN: ${{ inputs.token }}
      run: |
        bin=$RUNNER_TEMP/cosign-bin
        mkdir -p "$bin"
        curl -fsSL --retry 3 -o "$bin/cosign" \
          "https://github.com/sigstore/cosign/releases/download/$VERSION/cosign-linux-amd64"
        echo "$SHA256  $bin/cosign" | sha256sum -c -
        chmod 0755 "$bin/cosign"
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/cosign" version
        echo "$TOKEN" | "$bin/cosign" login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
